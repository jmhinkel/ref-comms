<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1210">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ref Comms</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Join -->
  <main id="join" class="screen">
    <header class="brand">
      <img src="icon.svg" alt="" width="44" height="44">
      <div>
        <h1>Ref Comms</h1>
        <p>Match-day radio for officials, on your phone</p>
      </div>
    </header>

    <form id="joinForm" class="card" autocomplete="off">
      <label>Your name
        <input id="name" required maxlength="30" placeholder="e.g. Jay">
      </label>

      <label>Role
        <select id="role">
          <option value="Referee">Referee</option>
          <option value="AR 1">Assistant Referee 1</option>
          <option value="AR 2">Assistant Referee 2</option>
          <option value="TMO">TMO</option>
          <option value="4th Official">4th Official</option>
          <option value="Assessor" data-listen>Assessor / Coach (listen only)</option>
        </select>
      </label>

      <label>Match code
        <div class="row">
          <input id="code" required maxlength="8" placeholder="ABCD" autocapitalize="characters" spellcheck="false">
          <button type="button" id="newCode" class="secondary">New match</button>
        </div>
      </label>

      <label class="check"><input type="checkbox" id="listenOnly"> Listen only (no microphone)</label>

      <button type="submit" class="primary big">Join match</button>
      <p id="joinError" class="error" hidden></p>
    </form>

    <p class="hint">Referee: tap <b>New match</b>, join, then show the QR code to your ARs. Use earbuds — speaker audio will feed back into the mic.</p>
  </main>

  <!-- Live -->
  <main id="live" class="screen" hidden>
    <header class="topbar">
      <button id="shareBtn" class="code-chip" title="Share match">
        <span class="label">MATCH</span> <span id="codeLabel">----</span>
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm-3 0h2v3h-2v-3zm5 3h3v2h-3v-2zm-5 3h3v2h-3v-2zm5 0h3v2h-3v-2z"/></svg>
      </button>
      <span id="netStatus" class="net ok">Connected</span>
      <button id="leaveBtn" class="ghost">Leave</button>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section id="roster" class="roster" aria-live="polite"></section>

    <section id="controls" class="controls">
      <div class="mode" role="radiogroup" aria-label="Mic mode">
        <button data-mode="open" class="on" role="radio">Open mic</button>
        <button data-mode="ptt" role="radio">Push to talk</button>
      </div>
      <p id="hsStatus" class="hs"></p>
      <button id="talk" class="talk">
        <span class="meter"><span id="meterFill"></span></span>
        <span id="talkLabel" class="talk-label">LIVE</span>
        <span id="talkSub" class="talk-sub">Tap to mute</span>
      </button>
    </section>
  </main>

  <!-- Share dialog -->
  <dialog id="shareDlg">
    <h2>Join this match</h2>
    <div id="qr" class="qr"></div>
    <p class="big-code" id="shareCode"></p>
    <p id="shareUrl" class="url"></p>
    <div class="row">
      <button id="nativeShare" class="primary">Share link</button>
      <button id="copyLink" class="secondary">Copy</button>
    </div>
    <form method="dialog"><button class="ghost wide">Close</button></form>
  </dialog>

  <div id="audioSink" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
